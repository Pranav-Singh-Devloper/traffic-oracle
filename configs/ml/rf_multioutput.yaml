inherits: base.yaml
model:
  name: rf_multioutput
  row_subsample: 0.1          # share of train rows (RF memory/time); documented in ADR-006
  params:
    n_estimators: 80
    max_depth: 24
    max_features: 0.33
    min_samples_leaf: 5
    max_samples: 0.5
  tuning: {n_trials: 6, train_rows: 60000, val_rows: 30000}
