inherits: base.yaml
graph: {variant: bidirectional}     # forward | backward | bidirectional | identity | random | knn_geo
model:
  name: gru_nograph
  d: 64
  layers: 2
  dropout: 0.1

  node_embedding: true
  use_time_features: true
train:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 40
  patience: 8
  clip: 5.0
  scheduler: plateau       # plateau | cosine
  loss: mae
  noise_std: 0.0
  sensor_mask_p: 0.0
  epoch_fraction: 0.34      # each epoch sees a random third of the (highly redundant) windows
seeds: [0, 1, 2]
