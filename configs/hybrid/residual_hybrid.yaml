inherits: base.yaml
graph: {variant: bidirectional}     # forward | backward | bidirectional | identity | random | knn_geo
model:
  name: hybrid_residual
  d: 64
  layers: 2
  dropout: 0.1
  heads: 4
  temporal: tcn          # tcn | gru
  attn_dropout: 0.1
  attention: gat         # gat | gatv2 | mean
  edge_bias: false
  readout: last          # last | attn
  dropedge: 0.0
  node_embedding: true
  use_time_features: true
train:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 100
  patience: 15
  clip: 5.0
  scheduler: plateau       # plateau | cosine
  loss: mae
  noise_std: 0.0
  sensor_mask_p: 0.0
seeds: [0, 1, 2]
