[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic"
version = "0.1.0"
description = "Traffic forecasting on METR-LA: GAT vs segment-level ML"
authors = [{name = "Pranav Singh"}, {name = "Kunal"}, {name = "Himanshu"}, {name = "Kanchan"}, {name = "Vaibhav"}]
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy", "pandas", "scipy", "scikit-learn", "xgboost", "torch",
  "networkx", "folium", "matplotlib", "optuna", "pyyaml", "tables",
  "holidays", "shap", "statsmodels", "joblib", "gdown", "requests", "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "pre-commit", "torch-geometric"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N803", "N806", "N812"]  # H, F, X, Y are standard math names

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: needs data/raw/metr-la.h5 (skipped when absent)"]
[tool.ruff.lint.per-file-ignores]
"scripts/make_eda_summary.py" = ["E501"]
"scripts/make_docs.py" = ["E501"]
